syntax = "proto3";

package agent_communication.auth;

import "common.proto";

// User Authentication Messages

// Register request
message RegisterRequest {
    string username = 1;
    string password = 2;
    string display_name = 3;
}

// Register response
message RegisterResponse {
    common.Status status = 1;
    string user_id = 2;            // Server-generated UUID
    string username = 3;
    string role = 4;               // USER | ADMIN
}

// Login request
message LoginRequest {
    string username = 1;
    string password = 2;
}

// Login response
message LoginResponse {
    common.Status status = 1;
    string user_id = 2;
    string username = 3;
    string token = 4;              // Auth token (UUID)
    int64 expires_at = 5;          // Expiry time (Unix timestamp)
    string role = 6;               // USER | ADMIN
}

// Token validation request (internal / interceptor use)
message ValidateTokenRequest {
    string token = 1;
}

// Token validation response
message ValidateTokenResponse {
    common.Status status = 1;
    string user_id = 2;
    string username = 3;
    bool valid = 4;
    string role = 5;               // USER | ADMIN
}

// User Service

// User authentication service
service UserService {
    // Register a new user
    rpc Register(RegisterRequest) returns (RegisterResponse);

    // User login
    rpc Login(LoginRequest) returns (LoginResponse);

    // Validate token (for interceptor internal use)
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}
