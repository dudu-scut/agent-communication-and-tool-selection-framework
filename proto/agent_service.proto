syntax = "proto3";

package agent_communication;

import "common.proto";

// Message type
message Message {
    string id = 1;
    string type = 2;
    string content = 3;
    int64 timestamp = 4;
    map<string, string> headers = 5;
    bytes payload = 6;
}

// Send message request
message SendMessageRequest {
    Message message = 1;
    string target_agent = 2;
    int32 timeout_seconds = 3;
}

// Send message response
message SendMessageResponse {
    common.Status status = 1;
    string message_id = 2;
    int64 timestamp = 3;
}

// Receive message request
message ReceiveMessageRequest {
    string agent_id = 1;
    int32 max_messages = 2;
    int32 timeout_seconds = 3;
}

// Receive message response
message ReceiveMessageResponse {
    common.Status status = 1;
    repeated Message messages = 2;
}

// Broadcast message request
message BroadcastMessageRequest {
    Message message = 1;
    repeated string target_agents = 2;
    bool exclude_sender = 3;
}

// Broadcast message response
message BroadcastMessageResponse {
    common.Status status = 1;
    int32 success_count = 2;
    int32 failure_count = 3;
    repeated string failed_agents = 4;
}

// Get agents request
message GetAgentsRequest {
    string filter = 1;
    int32 limit = 2;
    int32 offset = 3;
}

// Get agents response
message GetAgentsResponse {
    common.Status status = 1;
    repeated common.ServiceInfo agents = 2;
    int32 total_count = 3;
}

// Register agent request
message RegisterAgentRequest {
    common.ServiceInfo agent_info = 1;
    int32 heartbeat_interval = 2;
}

// Register agent response
message RegisterAgentResponse {
    common.Status status = 1;
    string agent_id = 2;
    int64 registration_time = 3;
}

// Unregister agent request
message UnregisterAgentRequest {
    string agent_id = 1;
    string reason = 2;
}

// Unregister agent response
message UnregisterAgentResponse {
    common.Status status = 1;
    int64 unregistration_time = 2;
}

// Heartbeat request
message HeartbeatRequest {
    string agent_id = 1;
    common.ServiceInfo agent_info = 2;
}

// Heartbeat response
message HeartbeatResponse {
    common.Status status = 1;
    int64 server_time = 2;
}

// Find agents request (filter by tag/skill)
message FindAgentsRequest {
    string tag = 1;
    string skill = 2;
    string keyword = 3;
    int32 limit = 4;
}

// Find agents response
message FindAgentsResponse {
    common.Status status = 1;
    repeated common.ServiceInfo agents = 2;
    int32 total_count = 3;
}

// Agent communication service
service AgentCommunicationService {
    // Unary RPC - send message
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
    
    // Unary RPC - receive message
    rpc ReceiveMessage(ReceiveMessageRequest) returns (ReceiveMessageResponse);
    
    // Unary RPC - broadcast message
    rpc BroadcastMessage(BroadcastMessageRequest) returns (BroadcastMessageResponse);
    
    // Unary RPC - get agents
    rpc GetAgents(GetAgentsRequest) returns (GetAgentsResponse);
    
    // Unary RPC - find agents by tag/skill
    rpc FindAgents(FindAgentsRequest) returns (FindAgentsResponse);
    
    // Unary RPC - register agent
    rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
    
    // Unary RPC - unregister agent
    rpc UnregisterAgent(UnregisterAgentRequest) returns (UnregisterAgentResponse);
    
    // Unary RPC - heartbeat
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    
    // Server-streaming RPC - listen for messages
    rpc ListenMessages(ReceiveMessageRequest) returns (stream Message);
    
    // Client-streaming RPC - batch send messages
    rpc BatchSendMessages(stream SendMessageRequest) returns (SendMessageResponse);
    
    // Bidirectional streaming RPC - real-time communication
    rpc RealTimeCommunication(stream Message) returns (stream Message);
}

// Health check service
service HealthService {
    rpc Check(common.HealthCheckRequest) returns (common.HealthCheckResponse);
    rpc Watch(common.HealthCheckRequest) returns (stream common.HealthCheckResponse);
}
