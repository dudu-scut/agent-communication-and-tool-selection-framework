syntax = "proto3";

package agent_communication;

import "common.proto";

// User Experience — Intervention Response & Sandbox Query

// User decision for an intervention point
message InterventionResponseRequest {
    string trace_id = 1;
    string decision = 2; // PROCEED, MODIFY, SKIP, ABORT
    string modification_text = 3;
    // Stable identifier of the persisted interventions row. The owner
    // is always taken from the auth context; this id selects the record.
    string intervention_id = 4;
}

message InterventionResponseResponse {
    common.Status status = 1;
    // The resolved state persisted to interventions.state.
    string new_state = 2;
    // Id of a reversible action written to undo_actions (empty when
    // the decision is not reversible).
    string undo_action_id = 3;
    // For PROCEED/MODIFY the deferred sandbox execution runs through
    // the durable pipeline; this is its request_id (empty otherwise).
    string executed_request_id = 4;
}

// Sandbox query for safe user-agent interaction
message SandboxQueryRequest {
    string query_text = 1;
    string agent_id = 2;
    string context_id = 3;
}

message SandboxQueryResponse {
    common.Status status = 1;
    string result = 2;
    // request_id of the real durable pipeline execution (query log /
    // trace ids derive from it). Empty when no execution happened.
    string request_id = 3;
    // True when the owner's autonomy level required confirmation and
    // a pending intervention was created instead of executing.
    bool intervention_required = 4;
    string intervention_id = 5;
}

// User Experience Service

service UserExperienceService {
    // Handle user intervention decision
    rpc InterventionResponse(InterventionResponseRequest) returns (InterventionResponseResponse);

    // Query sandbox for safe exploration
    rpc SandboxQuery(SandboxQueryRequest) returns (SandboxQueryResponse);
}
