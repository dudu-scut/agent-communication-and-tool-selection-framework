syntax = "proto3";

package agent_communication;

import "common.proto";

message SubmitFeedbackRequest {
    string trace_id = 1;
    string agent_id = 2;
    string skill_name = 3;
    int32 rating = 4;
    string comment = 5;
}

message SubmitFeedbackResponse {
    common.Status status = 1;
}

message GetAgentCompareRequest {
    string skill_name = 1;
}

message GetAgentCompareResponse {
    common.Status status = 1;
    repeated common.AgentMetrics agents = 2;
}

message SetAutonomyLevelRequest {
    string user_id = 1;
    string agent_id = 2;
    int32 level = 3;
}

message SetAutonomyLevelResponse {
    common.Status status = 1;
}

message UndoActionRequest {
    string trace_id = 1;
    int32 step_index = 2;
}

message UndoActionResponse {
    common.Status status = 1;
    bool success = 2;
    string message = 3;
}

service AgentLifecycleService {
    rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
    rpc GetAgentCompare(GetAgentCompareRequest) returns (GetAgentCompareResponse);
    rpc SetAutonomyLevel(SetAutonomyLevelRequest) returns (SetAutonomyLevelResponse);
    rpc UndoAction(UndoActionRequest) returns (UndoActionResponse);
}
