syntax = "proto3";

package agent_communication;

import "common.proto";

message SubmitFeedbackRequest {
    string trace_id = 1;
    string agent_id = 2;
    string skill_name = 3;
    int32 rating = 4;
    string comment = 5;
}

message SubmitFeedbackResponse {
    common.Status status = 1;
}

message GetAgentCompareRequest {
    string skill_name = 1;
}

message GetAgentCompareResponse {
    common.Status status = 1;
    repeated common.AgentMetrics agents = 2;
    // [PR-E] Real summary of the owner's persisted compare_runs rows
    // (PostgreSQL is the source of truth; empty list is the true empty
    // state, never fabricated metrics).
    repeated CompareRunSummary runs = 3;
}

// [PR-E] One persisted compare run (compare_runs table).
message CompareRunSummary {
    string run_id = 1;
    string request_text = 2;
    string status = 3;      // running | completed | partial | failed | cancelled
    string results_json = 4; // raw compare_runs.results JSONB
    string created_at = 5;
}

message SetAutonomyLevelRequest {
    string user_id = 1; // [PR-E] ignored — owner comes from the auth context
    string agent_id = 2;
    int32 level = 3;    // 1..4 only
}

message SetAutonomyLevelResponse {
    common.Status status = 1;
}

message UndoActionRequest {
    string trace_id = 1;  // legacy; superseded by action_id
    int32 step_index = 2; // legacy
    // [PR-E] undo_actions.id of the reversible action to revert.
    string action_id = 3;
}

message UndoActionResponse {
    common.Status status = 1;
    bool success = 2;
    string message = 3;
}

// [PR-E] Parallel comparison of at most 3 healthy agents. Each agent runs
// the same question through the durable pipeline with an independent
// request_id/conversation; per-agent failures stay visible and never get
// masked by an overall success.
message CompareAgentsRequest {
    string question = 1;
    repeated string agent_ids = 2; // 1..3 entries, duplicates refused
}

message CompareAgentResult {
    string agent_id = 1;
    string status = 2;   // completed | failed | cancelled
    string answer = 3;
    string error = 4;
    string request_id = 5;
    string trace_id = 6;
}

message CompareAgentsResponse {
    common.Status status = 1;
    string run_id = 2;
    string run_status = 3; // completed | partial | failed | cancelled
    repeated CompareAgentResult results = 4;
}

service AgentLifecycleService {
    rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
    rpc GetAgentCompare(GetAgentCompareRequest) returns (GetAgentCompareResponse);
    rpc SetAutonomyLevel(SetAutonomyLevelRequest) returns (SetAutonomyLevelResponse);
    rpc UndoAction(UndoActionRequest) returns (UndoActionResponse);
    // [PR-E] Real compare execution (see CompareAgentsRequest notes).
    rpc CompareAgents(CompareAgentsRequest) returns (CompareAgentsResponse);
}
