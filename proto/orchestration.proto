syntax = "proto3";

package agent_communication;

import "common.proto";

// ============================================================================
// U4: DAG Composition — Orchestration Plan & Execution
// Batch 4: Unified Memory + Activity Feed + DAG Composition
// ============================================================================

// A single node in a DAG execution plan
message DAGNode {
    string id = 1;
    string description = 2;
    string agent_id = 3;
    repeated string dependencies = 4;
}

// Complete DAG structure
message DAGStructure {
    repeated DAGNode nodes = 1;
}

// Request to execute a user-defined (or user-modified) DAG plan
message ExecutePlanRequest {
    DAGStructure dag = 1;
    string context_id = 2;
    string user_id = 3;
}

// Response from executing a DAG plan
message ExecutePlanResponse {
    common.Status status = 1;
    string trace_id = 2;
}

// ============================================================================
// Batch 5: Query Replay — ReplayQuery RPC
// ============================================================================

message ReplayQueryRequest {
    string trace_id = 1;
    string mode = 2; // "exact" or "route"
}

message ReplayQueryResponse {
    common.Status status = 1;
    string original = 2;
    string replayed = 3;
    // PR-D: exact replay persists a NEW trace (the original is never
    // overwritten). These fields identify the new records; empty in
    // route mode, which performs no execution at all.
    string new_trace_id = 4;
    string new_request_id = 5;
}

// ============================================================================
// Batch 6: Export Conversation
// ============================================================================

message ExportConversationRequest {
    string context_id = 1;
    string format = 2; // "markdown" or "html"
}

message ExportConversationResponse {
    common.Status status = 1;
    bytes file_data = 2;
    string mime_type = 3;
}

// ============================================================================
// Orchestration Service
// ============================================================================

service OrchestrationService {
    // Execute a user-approved (or user-modified) DAG plan
    rpc ExecutePlan(ExecutePlanRequest) returns (ExecutePlanResponse);

    // Batch 5: Replay a previous query (exact or route-only)
    rpc ReplayQuery(ReplayQueryRequest) returns (ReplayQueryResponse);

    // Batch 6: Export conversation as Markdown or HTML
    rpc ExportConversation(ExportConversationRequest) returns (ExportConversationResponse);
}
